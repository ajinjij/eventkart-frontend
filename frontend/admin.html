<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — eventkart</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header><div class="header-inner" id="site-nav"></div></header>

<div class="wrap page">
  <h1>Admin dashboard</h1>

  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:32px" id="stats-grid"></div>

  <p class="section-label">Pending vendor approvals</p>
  <div id="pending-vendors"></div>

  <p class="section-label" style="margin-top:32px">Disputed bookings</p>
  <div id="disputed-bookings"></div>

  <p class="section-label" style="margin-top:32px">Coupons</p>
  <form id="coupon-form" style="max-width:520px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
    <input type="text" id="c-code" placeholder="CODE (e.g. WELCOME10)" required style="text-transform:uppercase">
    <select id="c-type"><option value="PERCENT">% off</option><option value="FLAT">₹ off</option></select>
    <input type="number" id="c-value" placeholder="Value (e.g. 10)" required>
    <input type="number" id="c-min" placeholder="Min order (optional)">
    <input type="number" id="c-max-uses" placeholder="Max uses (optional)">
    <input type="date" id="c-expires" placeholder="Expires (optional)">
    <button class="btn btn-fill" style="grid-column:1/-1" type="submit">Create coupon</button>
  </form>
  <div id="coupons-list"></div>

  <p class="section-label" style="margin-top:32px">Site settings</p>
  <form id="settings-form" style="max-width:520px">
    <div class="field">
      <label>Accent color</label>
      <input type="color" id="s-accent" style="width:80px;padding:4px">
    </div>
    <div class="field">
      <label>Homepage headline</label>
      <input type="text" id="s-headline" style="width:100%">
    </div>
    <div class="field">
      <label>Homepage subtext</label>
      <textarea id="s-subtext" rows="2"></textarea>
    </div>
    <button class="btn btn-fill" type="submit">Save site settings</button>
    <span class="success-msg" id="settings-saved"></span>
  </form>
</div>

<footer>eventkart · connecting customers with trusted event coordinators</footer>

<script src="assets/api.js"></script>
<script>
  requireRole("ADMIN");
  renderNav("admin");

  async function loadStats() {
    const stats = await apiFetch("/admin/stats");
    document.getElementById("stats-grid").innerHTML = `
      <div class="card"><div class="card-body">
        <div class="cat">Commission earned</div>
        <h4 style="font-size:20px">${formatMoney(stats.totalCommission)}</h4>
      </div></div>
      <div class="card"><div class="card-body">
        <div class="cat">Active bookings</div>
        <h4 style="font-size:20px">${stats.activeBookings}</h4>
      </div></div>
      <div class="card"><div class="card-body">
        <div class="cat">Open disputes</div>
        <h4 style="font-size:20px;color:var(--red)">${stats.openDisputes}</h4>
      </div></div>
    `;
  }

  async function loadPendingVendors() {
    const vendors = await apiFetch("/admin/vendors/pending");
    const el = document.getElementById("pending-vendors");
    if (!vendors.length) {
      el.innerHTML = `<div class="empty-state">No pending vendor approvals right now.</div>`;
      return;
    }
    el.innerHTML = vendors.map(v => `
      <div class="list-item">
        <div class="info">
          <h4>${v.businessName}</h4>
          <p>${v.user.name} · ${v.user.email} · ${v.category} · ${v.city}</p>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-fill" onclick="approveVendor(${v.id})">Approve</button>
          <button class="btn btn-sm btn-outline-danger" onclick="rejectVendor(${v.id})">Reject</button>
        </div>
      </div>
    `).join("");
  }

  async function approveVendor(id) {
    try {
      await apiFetch(`/admin/vendors/${id}/approve`, { method: "POST" });
      loadPendingVendors();
    } catch (err) { alert(err.message); }
  }

  async function rejectVendor(id) {
    if (!confirm("Reject this vendor? They won't be able to list packages.")) return;
    try {
      await apiFetch(`/admin/vendors/${id}/reject`, { method: "POST" });
      loadPendingVendors();
    } catch (err) { alert(err.message); }
  }

  async function loadDisputes() {
    const bookings = await apiFetch("/admin/bookings/disputed");
    const el = document.getElementById("disputed-bookings");
    if (!bookings.length) {
      el.innerHTML = `<div class="empty-state">No open disputes.</div>`;
      return;
    }
    el.innerHTML = bookings.map(b => `
      <div class="list-item">
        <div class="info">
          <h4>Booking #${b.id} · ${b.vendor.businessName}</h4>
          <p>${b.customer.name} (${b.customer.email}) · ${formatMoney(b.totalAmount)}</p>
          <p style="color:var(--red)">"${b.disputeReason || "No reason given"}"</p>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm btn-fill" onclick="resolveDispute(${b.id}, 'release')">Release funds to vendor</button>
          <button class="btn btn-sm btn-outline-danger" onclick="resolveDispute(${b.id}, 'refund')">Refund customer</button>
        </div>
      </div>
    `).join("");
  }

  async function resolveDispute(bookingId, action) {
    try {
      await apiFetch(`/payments/${bookingId}/${action}`, { method: "POST" });
      alert(`${action === "release" ? "Funds released to vendor" : "Customer refunded"}.`);
      loadDisputes();
      loadStats();
    } catch (err) { alert(err.message); }
  }

  async function loadCoupons() {
    const coupons = await apiFetch("/admin/coupons");
    const el = document.getElementById("coupons-list");
    if (!coupons.length) {
      el.innerHTML = `<div class="empty-state">No coupons yet.</div>`;
      return;
    }
    el.innerHTML = coupons.map(c => `
      <div class="list-item">
        <div class="info">
          <h4>${c.code} ${c.active ? "" : "(inactive)"}</h4>
          <p>${c.type === "PERCENT" ? c.value + "% off" : formatMoney(c.value) + " off"}
            ${c.minOrder ? " · min " + formatMoney(c.minOrder) : ""}
            ${c.maxUses ? ` · ${c.usedCount}/${c.maxUses} used` : ` · ${c.usedCount} used`}
            ${c.expiresAt ? " · expires " + new Date(c.expiresAt).toLocaleDateString() : ""}</p>
        </div>
        <button class="btn btn-sm ${c.active ? "btn-outline-danger" : "btn-fill"}" onclick="toggleCoupon(${c.id}, ${!c.active})">
          ${c.active ? "Deactivate" : "Activate"}
        </button>
      </div>
    `).join("");
  }

  document.getElementById("coupon-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await apiFetch("/admin/coupons", {
        method: "POST",
        body: JSON.stringify({
          code: document.getElementById("c-code").value,
          type: document.getElementById("c-type").value,
          value: Number(document.getElementById("c-value").value),
          minOrder: document.getElementById("c-min").value || undefined,
          maxUses: document.getElementById("c-max-uses").value || undefined,
          expiresAt: document.getElementById("c-expires").value || undefined,
        }),
      });
      e.target.reset();
      loadCoupons();
    } catch (err) { alert(err.message); }
  });

  async function toggleCoupon(id, active) {
    try {
      await apiFetch(`/admin/coupons/${id}`, { method: "PATCH", body: JSON.stringify({ active }) });
      loadCoupons();
    } catch (err) { alert(err.message); }
  }

  async function loadSettings() {
    const settings = await apiFetch("/admin/settings");
    document.getElementById("s-accent").value = settings.accentColor || "#E8607C";
    document.getElementById("s-headline").value = settings.heroHeadline || "";
    document.getElementById("s-subtext").value = settings.heroSubtext || "";
  }

  document.getElementById("settings-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await apiFetch("/admin/settings", {
        method: "PUT",
        body: JSON.stringify({
          accentColor: document.getElementById("s-accent").value,
          heroHeadline: document.getElementById("s-headline").value,
          heroSubtext: document.getElementById("s-subtext").value,
        }),
      });
      document.getElementById("settings-saved").textContent = "Saved ✓ — changes are live on the homepage now.";
      setTimeout(() => (document.getElementById("settings-saved").textContent = ""), 3000);
    } catch (err) { alert(err.message); }
  });

  loadStats();
  loadPendingVendors();
  loadDisputes();
  loadCoupons();
  loadSettings();
</script>
</body>
</html>
